# Local Postgres for development — matches DATABASE_URL in .env.example.
# `docker compose up -d` → `npx prisma migrate deploy` → `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadgenius
      POSTGRES_PASSWORD: leadgenius
      POSTGRES_DB: leadgenius
    ports:
      - "5432:5432"
    volumes:
      - leadgenius-pg:/var/lib/postgresql/data

volumes:
  leadgenius-pg:
